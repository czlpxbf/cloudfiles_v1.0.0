name = "cloudfiles-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# D1 数据库（文件树/用户/元数据）
[[d1_databases]]
binding = "DB"
database_name = "cloudfiles-db"
database_id = "8e717e13-cb12-4efb-a2b5-842899562a5e"

# KV（上传任务/索引缓存）
[[kv_namespaces]]
binding = "KV"
id = "87e9c6e7d22e4919a42e3a1a3720575f"

# 环境变量（部署时用 wrangler secret put 注入，勿写明文）：
#   CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN / JWT_SECRET / CF_PROJECT_PREFIX / CF_ENV
